<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IA & Creatividad</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --orange-deep:   #c24b00;
    --orange-main:   #e8631a;
    --orange-mid:    #f28c3c;
    --orange-light:  #fbb97a;
    --orange-pale:   #fde8d0;
    --cream:         #fdf6ee;
    --dark:          #1a0f07;
    --text-dim:      #8b5e3c;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ── Gradient background ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 20% 10%, #fde0c080 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 80% 80%, #f5b97040 0%, transparent 55%),
      radial-gradient(ellipse 80% 80% at 50% 50%, #fff8f2 0%, var(--cream) 100%);
    z-index: 0;
  }

  /* ── Floating background letters ── */
  .bg-letters {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }

  .bg-letter {
    position: absolute;
    font-family: 'Bebas Neue', cursive;
    color: var(--orange-main);
    opacity: 0;
    animation: floatLetter linear infinite;
    user-select: none;
  }

  @keyframes floatLetter {
    0%   { transform: translateY(0)   rotate(var(--rot)); opacity: 0; }
    10%  { opacity: var(--op); }
    90%  { opacity: var(--op); }
    100% { transform: translateY(-110vh) rotate(calc(var(--rot) + 20deg)); opacity: 0; }
  }

  /* ── Main container ── */
  .stage {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    width: 100%;
    padding: 2rem 1rem;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 3.5rem;
  }
  .header-eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: clamp(0.65rem, 1.5vw, 0.8rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--orange-mid);
    margin-bottom: 0.6rem;
  }
  .header-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(1.5rem, 4vw, 2.4rem);
    color: var(--dark);
    letter-spacing: 0.04em;
    line-height: 1.2;
  }
  .header-title em {
    font-style: italic;
    color: var(--orange-main);
  }

  /* ── Word display area ── */
  .word-area {
    width: 100%;
    max-width: 780px;
    min-height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 3rem;
  }

  /* progress dots */
  .progress-dots {
    position: absolute;
    bottom: -1.8rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--orange-pale);
    border: 1.5px solid var(--orange-light);
    transition: background 0.4s, transform 0.3s;
  }
  .dot.active  { background: var(--orange-main); border-color: var(--orange-main); transform: scale(1.3); }
  .dot.done    { background: var(--orange-light); border-color: var(--orange-light); }

  /* ── The big word ── */
  .word-display {
    display: flex;
    gap: 0;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }

  .letter-span {
    font-family: 'Bebas Neue', cursive;
    font-size: clamp(3.5rem, 10vw, 8rem);
    color: transparent;
    background: linear-gradient(135deg, var(--orange-deep) 0%, var(--orange-main) 50%, var(--orange-mid) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    line-height: 1;
    display: inline-block;
    opacity: 0;
    transform: translateY(30px) scale(0.85);
    transition: opacity 0.45s cubic-bezier(.22,1,.36,1),
                transform 0.45s cubic-bezier(.22,1,.36,1);
    will-change: transform, opacity;
  }

  .letter-span.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* word-level fade wrapper */
  .word-wrapper {
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .word-wrapper.show { opacity: 1; }

  /* ── Counter label ── */
  .counter-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 300;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
    min-height: 1.2em;
    transition: opacity 0.4s;
  }

  /* ── Button ── */
  .btn-wrapper {
    margin-top: 2.5rem;
    position: relative;
  }

  .btn-show {
    position: relative;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: clamp(0.85rem, 2vw, 1rem);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #fff;
    background: linear-gradient(135deg, var(--orange-deep), var(--orange-main) 60%, var(--orange-mid));
    border: none;
    border-radius: 60px;
    padding: 1rem 3rem;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.3s;
    box-shadow: 0 6px 28px #e8631a44;
  }

  .btn-show::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.15) 100%);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .btn-show:hover { transform: translateY(-2px); box-shadow: 0 10px 36px #e8631a55; }
  .btn-show:hover::before { opacity: 1; }
  .btn-show:active { transform: translateY(0); }

  .btn-show:disabled {
    background: linear-gradient(135deg, #c9a48a, #d9b99a);
    box-shadow: none;
    cursor: default;
    transform: none;
  }

  /* ripple */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transform: scale(0);
    animation: rippleAnim 0.55s linear;
    pointer-events: none;
  }
  @keyframes rippleAnim {
    to { transform: scale(4); opacity: 0; }
  }

  /* ── All-done state ── */
  .done-msg {
    opacity: 0;
    pointer-events: none;
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    transition: opacity 0.6s 0.3s;
  }
  .done-msg.show { opacity: 1; pointer-events: auto; }
  .done-msg p {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    color: var(--orange-deep);
    font-style: italic;
    letter-spacing: 0.05em;
  }
  .done-msg span {
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* ── Word history ── */
  .history-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    max-width: 680px;
    min-height: 2.2rem;
    margin-top: 0.5rem;
  }
  .history-tag {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--orange-deep);
    border: 1px solid var(--orange-light);
    border-radius: 100px;
    padding: 0.22rem 0.75rem;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.4s, transform 0.4s;
    background: rgba(255,255,255,0.6);
  }
  .history-tag.show { opacity: 1; transform: scale(1); }

  /* ── Decorative line ── */
  .deco-line {
    width: 40px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--orange-light), transparent);
    margin: 0 auto 0.8rem;
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .word-area { min-height: 120px; }
    .letter-span { font-size: clamp(3rem, 14vw, 5.5rem); }
  }
</style>
</head>
<body>

<div class="bg-letters" id="bgLetters"></div>

<div class="stage">

  <header class="header">
    <p class="header-eyebrow">Inteligencia Artificial &amp; Cultura</p>
    <div class="deco-line"></div>
    <h1 class="header-title">El vocabulario que define<br><em>el futuro creativo</em></h1>
  </header>

  <div class="word-area">
    <div class="word-wrapper" id="wordWrapper">
      <div class="word-display" id="wordDisplay"></div>
    </div>
    <div class="done-msg" id="doneMsg">
      <p>Once pilares del futuro creativo.</p>
      <span>IA · Autoría · Cultura</span>
    </div>
    <div class="progress-dots" id="progressDots"></div>
  </div>

  <p class="counter-label" id="counterLabel">Pulsa para descubrir la primera palabra</p>

  <div class="history-strip" id="historyStrip"></div>

  <div class="btn-wrapper">
    <button class="btn-show" id="btnShow">Mostrar palabra</button>
  </div>

</div>

<script>
  const WORDS = [
    "AUTORÍA","ENTRENAMIENTO","DERECHOS","ESTILO","TRANSPARENCIA",
    "RESPONSABILIDAD","ÉTICA","ORIGINALIDAD","PROTECCIÓN","CREATIVIDAD","AUTENTICIDAD"
  ];

  let current = 0;
  let animating = false;

  const wordDisplay   = document.getElementById('wordDisplay');
  const wordWrapper   = document.getElementById('wordWrapper');
  const counterLabel  = document.getElementById('counterLabel');
  const btnShow       = document.getElementById('btnShow');
  const dotsContainer = document.getElementById('progressDots');
  const historyStrip  = document.getElementById('historyStrip');
  const doneMsg       = document.getElementById('doneMsg');

  /* ── Progress dots ── */
  WORDS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    dotsContainer.appendChild(d);
  });

  /* ── Background floating letters ── */
  const pool = 'AUTORIAENTRENAMIENTODERECHOSESTILORESPONSABILIDAD';
  const bg   = document.getElementById('bgLetters');

  for (let i = 0; i < 38; i++) {
    const el  = document.createElement('span');
    el.className = 'bg-letter';
    el.textContent = pool[Math.floor(Math.random() * pool.length)];
    const size   = 14 + Math.random() * 52;
    const left   = Math.random() * 100;
    const delay  = Math.random() * 18;
    const dur    = 14 + Math.random() * 20;
    const op     = (0.04 + Math.random() * 0.10).toFixed(3);
    const rot    = (Math.random() * 40 - 20).toFixed(1) + 'deg';
    el.style.cssText = `
      font-size:${size}px;
      left:${left}%;
      bottom:-10%;
      --rot:${rot};
      --op:${op};
      animation-duration:${dur}s;
      animation-delay:-${delay}s;
    `;
    bg.appendChild(el);
  }

  /* ── Ripple ── */
  btnShow.addEventListener('click', function(e) {
    const rect = this.getBoundingClientRect();
    const rip  = document.createElement('span');
    rip.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    rip.style.cssText = `width:${size}px;height:${size}px;
      left:${e.clientX - rect.left - size/2}px;
      top:${e.clientY - rect.top - size/2}px`;
    this.appendChild(rip);
    setTimeout(() => rip.remove(), 600);
    showNextWord();
  });

  /* ── Show word ── */
  function showNextWord() {
    if (animating || current >= WORDS.length) return;
    animating = true;
    btnShow.disabled = true;

    const word = WORDS[current];

    // fade-out previous
    wordWrapper.classList.remove('show');

    setTimeout(() => {
      // build letters
      wordDisplay.innerHTML = '';
      [...word].forEach(char => {
        const s = document.createElement('span');
        s.className = 'letter-span';
        s.textContent = char;
        wordDisplay.appendChild(s);
      });

      wordWrapper.classList.add('show');

      // staggered letter animation
      const letters = wordDisplay.querySelectorAll('.letter-span');
      letters.forEach((l, i) => {
        setTimeout(() => { l.classList.add('visible'); }, i * 55 + 80);
      });

      // update dot
      document.getElementById(`dot-${current}`).classList.add('active');

      // counter label
      const remaining = WORDS.length - current - 1;
      if (remaining > 0) {
        counterLabel.textContent = `${current + 1} / ${WORDS.length} — Siguiente: pulsa el botón`;
      } else {
        counterLabel.textContent = `${WORDS.length} / ${WORDS.length} — Todas las palabras reveladas`;
      }

      // history tag
      addHistoryTag(word, current);

      // done check
      if (current === WORDS.length - 1) {
        setTimeout(() => {
          btnShow.disabled = true;
          btnShow.textContent = 'Completado ✦';
          doneMsg.classList.add('show');
        }, 700);
      }

      // mark dot done on next iteration
      const prev = current;
      current++;
      setTimeout(() => {
        document.getElementById(`dot-${prev}`).classList.remove('active');
        document.getElementById(`dot-${prev}`).classList.add('done');
        animating = false;
        if (current < WORDS.length) btnShow.disabled = false;
      }, letters.length * 55 + 500);

    }, wordWrapper.classList.contains('show') ? 200 : 0);
  }

  function addHistoryTag(word, idx) {
    setTimeout(() => {
      const tag = document.createElement('span');
      tag.className = 'history-tag';
      tag.textContent = word;
      historyStrip.appendChild(tag);
      requestAnimationFrame(() => {
        requestAnimationFrame(() => tag.classList.add('show'));
      });
    }, 350);
  }
</script>
</body>
</html>
