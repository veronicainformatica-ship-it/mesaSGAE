<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inicio · IA & Propiedad Intelectual</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600;1,700&display=swap" />
<style>
  /* Open Sauce One */
  @font-face {
    font-family: 'Open Sauce One';
    src: url('https://cdn.jsdelivr.net/gh/marcologous/Open-Sauce-Fonts@master/fonts/OpenSauceOne/OpenSauceOne-Regular.woff2') format('woff2');
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: 'Open Sauce One';
    src: url('https://cdn.jsdelivr.net/gh/marcologous/Open-Sauce-Fonts@master/fonts/OpenSauceOne/OpenSauceOne-Light.woff2') format('woff2');
    font-weight: 300; font-style: normal;
  }
  @font-face {
    font-family: 'Open Sauce One';
    src: url('https://cdn.jsdelivr.net/gh/marcologous/Open-Sauce-Fonts@master/fonts/OpenSauceOne/OpenSauceOne-Medium.woff2') format('woff2');
    font-weight: 500; font-style: normal;
  }
  @font-face {
    font-family: 'Open Sauce One';
    src: url('https://cdn.jsdelivr.net/gh/marcologous/Open-Sauce-Fonts@master/fonts/OpenSauceOne/OpenSauceOne-Bold.woff2') format('woff2');
    font-weight: 700; font-style: normal;
  }
  @font-face {
    font-family: 'Open Sauce One';
    src: url('https://cdn.jsdelivr.net/gh/marcologous/Open-Sauce-Fonts@master/fonts/OpenSauceOne/OpenSauceOne-Italic.woff2') format('woff2');
    font-weight: 400; font-style: italic;
  }
  @font-face {
    font-family: 'Open Sauce One';
    src: url('https://cdn.jsdelivr.net/gh/marcologous/Open-Sauce-Fonts@master/fonts/OpenSauceOne/OpenSauceOne-BoldItalic.woff2') format('woff2');
    font-weight: 700; font-style: italic;
  }
  :root {
    --orange-deep:  #c94e00;
    --orange-main:  #f26522;
    --orange-mid:   #f5a623;
    --orange-light: #f9c96a;
    --cream:        #fff8f0;
    --dark:         #1c0e05;
    --text-dim:     #9a6030;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Open Sauce One', sans-serif;
    background: url('Jornada_IA_sin_footergimp.png') center center / cover no-repeat;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  #bgCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .stage {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 1100px;
    padding: 2rem 1.5rem 7rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Header ── */
  .eyebrow {
    font-family: 'Open Sauce One', sans-serif;
    font-weight: 300;
    font-size: clamp(0.6rem, 1.4vw, 0.78rem);
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--orange-mid);
    margin-bottom: 0.6rem;
    text-align: center;
    opacity: 0;
    animation: fadeUp 0.8s 0.15s ease forwards;
  }
  .deco-line {
    width: 40px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--orange-light), transparent);
    margin: 0 auto 1.4rem;
    opacity: 0;
    animation: fadeUp 0.8s 0.3s ease forwards;
  }

  /* ── Apertura badge ── */
  .apertura-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'Open Sauce One', sans-serif;
    font-size: 0.82rem;
    letter-spacing: 0.28em;
    color: #fff;
    background: linear-gradient(135deg, var(--orange-deep), var(--orange-main));
    border-radius: 100px;
    padding: 0.32rem 1.1rem;
    margin-bottom: 1.4rem;
    opacity: 0;
    animation: fadeUp 0.8s 0.45s ease forwards;
  }

  /* ── Título ── */
  .titulo {
    font-family: 'Open Sauce One', serif;
    font-weight: 300;
    font-size: clamp(1.7rem, 4.8vw, 3.8rem);
    color: var(--dark);
    letter-spacing: 0.02em;
    line-height: 1.18;
    text-align: center;
    margin-bottom: 0.5rem;
    opacity: 0;
    animation: fadeUp 1s 0.55s ease forwards;
  }
  .titulo em {
    font-style: italic;
    background: linear-gradient(135deg, var(--orange-deep) 0%, var(--orange-main) 50%, var(--orange-mid) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* ── Frase clave ── */
  .frase-clave {
    display: block;
    font-family: 'Open Sauce One', serif;
    font-weight: 700;
    font-style: italic;
    font-size: clamp(1.05rem, 2.8vw, 1.6rem);
    color: var(--orange-main);
    text-align: center;
    max-width: 720px;
    line-height: 1.5;
    margin: 1.4rem auto 0;
    padding: 1.2rem 1.8rem;
    border: 2.5px solid var(--orange-main);
    background: #ffffff;
    border-radius: 1rem;
    box-shadow: 0 4px 20px rgba(242,101,34,0.12);
    opacity: 0;
    animation: fadeUp 0.9s 0.7s ease forwards;
  }

  /* ── Mesa ilustrada ── */
  .mesa-scene {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 2.8rem auto 0;
    opacity: 0;
    animation: fadeUp 1s 0.9s ease forwards;
  }
  .mesa-scene svg {
    width: 100%;
    height: auto;
    filter: drop-shadow(0 10px 28px rgba(242,101,34,0.15));
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Partículas que salen de la mesa */
  .particle {
    position: absolute;
    font-family: 'Open Sauce One', sans-serif;
    pointer-events: none;
    opacity: 0;
    animation: flyOut var(--dur) var(--delay) ease-in-out infinite;
  }
  @keyframes flyOut {
    0%   { opacity: 0;   transform: translate(0,0) rotate(0deg) scale(0.5); }
    12%  { opacity: 0.9; }
    85%  { opacity: 0.5; }
    100% { opacity: 0;   transform: translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(1.1); }
  }

  /* ── Botones ── */
  .btn-group {
    display: flex;
    gap: 1rem;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 2.6rem;
    opacity: 0;
    animation: fadeUp 0.8s 1.2s ease forwards;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Open Sauce One', sans-serif;
    font-weight: 500;
    font-size: clamp(0.82rem, 1.8vw, 0.95rem);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #fff;
    background: linear-gradient(135deg, #c94e00, #f26522 55%, #f5a623);
    border: none;
    border-radius: 60px;
    padding: 1rem 2.6rem;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.3s;
    box-shadow: 0 6px 28px rgba(242,101,34,0.27);
    position: relative; overflow: hidden;
  }
  .btn-primary::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.15));
    opacity: 0; transition: opacity 0.3s;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 36px rgba(242,101,34,0.38); }
  .btn-primary:hover::before { opacity: 1; }
  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Open Sauce One', sans-serif;
    font-weight: 500;
    font-size: clamp(0.82rem, 1.8vw, 0.95rem);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--orange-deep);
    background: transparent;
    border: 2px solid var(--orange-main);
    border-radius: 60px;
    padding: 1rem 2.6rem;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.2s, background 0.25s, color 0.25s, box-shadow 0.3s;
  }
  .btn-secondary:hover {
    background: var(--orange-main); color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 10px 36px rgba(242,101,34,0.35);
  }

  /* ── Logos ── */

  @media (max-width: 600px) {
    .btn-group { flex-direction: column; }
  }

  /* ── Título principal: color fijo, negrita, sin cursiva ── */
  .header-title,
  .titulo {
    font-weight: 700;
    font-style: normal;
    color: #13697d;
  }
  .header-title em,
  .titulo em,
  .title-plain {
    font-style: normal !important;
    font-weight: 700;
    background: none !important;
    -webkit-background-clip: unset !important;
    background-clip: unset !important;
    color: #13697d !important;
  }

  /* ── Eyebrow / fecha: color azul claro ── */
  .header-eyebrow,
  .eyebrow {
    color: #89cddd !important;
    font-weight: 700 !important;
  }

<canvas id="bgCanvas"></canvas>

<div class="stage">

  <p class="eyebrow">Jornada · 28 d'abril de 2026</p>
  <div class="deco-line"></div>
  <div class="apertura-badge">&#9670;&ensp;Apertura de la mesa</div>

  <h1 class="titulo">Intel·ligència artificial<br><span class="title-plain">i propietat intel·lectual</span></h1>

  <p class="frase-clave">
    &ldquo;¿Cómo está impactando la inteligencia artificial en vuestro ámbito profesional?&rdquo;
  </p>

  <!-- Botones -->
  <div class="btn-group">
    <a href="palabra-ia.html" class="btn-primary">Algoritmo →</a>
  </div>

</div>

<!-- Logos -->

<script>
const canvas = document.getElementById('bgCanvas');
const ctx    = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const SYMS   = ['♪','♫','♩','♬','A','R','T','0','1','∞','©','®'];
const COLORS = ['#f26522','#f5a623','#c94e00','#f9c96a'];

const pts = Array.from({length: 38}, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  vy: -(0.22 + Math.random() * 0.5),
  vx: (Math.random() - 0.5) * 0.28,
  size: 9 + Math.random() * 16,
  alpha: 0.03 + Math.random() * 0.08,
  sym: SYMS[Math.floor(Math.random() * SYMS.length)],
  color: COLORS[Math.floor(Math.random() * COLORS.length)],
  rot: Math.random() * Math.PI * 2,
  rotV: (Math.random() - 0.5) * 0.01,
}));

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  pts.forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle   = p.color;
    ctx.font        = `${p.size}px 'Open Sauce One', sans-serif`;
    ctx.textAlign   = 'center';
    ctx.fillText(p.sym, 0, 0);
    ctx.restore();
    p.y += p.vy; p.x += p.vx; p.rot += p.rotV;
    if (p.y < -30) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
  });
  requestAnimationFrame(draw);
}
document.fonts.ready.then(draw);
</script>

</body>
