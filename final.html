<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Final · IA & Propiedad Intelectual</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --orange-deep:  #c94e00;
    --orange-main:  #f26522;
    --orange-mid:   #f5a623;
    --orange-light: #f9c96a;
    --cream:        #fff8f0;
    --dark:         #1c0e05;
    --text-dim:     #9a6030;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 75% 65% at 15% 10%, #f9a53855 0%, transparent 55%),
      radial-gradient(ellipse 60% 55% at 85% 80%, #f2621544 0%, transparent 55%),
      radial-gradient(ellipse 100% 90% at 50% 40%, #fef0dc 0%, #fde3b8 100%);
    z-index: 0;
  }

  #bgCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .stage {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 1100px;
    padding: 2rem 1.5rem 6rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Header ── */
  .eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: clamp(0.6rem, 1.4vw, 0.78rem);
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--orange-mid);
    margin-bottom: 0.6rem;
    opacity: 0;
    animation: fadeUp 0.8s 0.2s ease forwards;
    text-align: center;
  }
  .deco-line {
    width: 40px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--orange-light), transparent);
    margin: 0 auto 1.4rem;
    opacity: 0;
    animation: fadeUp 0.8s 0.35s ease forwards;
  }

  /* ── Frase ── */
  .frase-wrapper {
    text-align: center;
    opacity: 0;
    animation: fadeUp 1s 0.5s ease forwards;
    margin-bottom: 3.5rem;
  }
  .frase-pre {
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: clamp(0.78rem, 1.8vw, 0.95rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 1rem;
  }
  .frase-main {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(2rem, 5.5vw, 4.6rem);
    line-height: 1.18;
    color: var(--dark);
    letter-spacing: 0.02em;
  }
  .frase-main em {
    font-style: italic;
    background: linear-gradient(135deg, var(--orange-deep) 0%, var(--orange-main) 50%, var(--orange-mid) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* ── Fila de ilustraciones ── */
  .illustrations {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: clamp(2rem, 6vw, 6rem);
    width: 100%;
    opacity: 0;
    animation: fadeUp 1s 0.85s ease forwards;
  }

  .illus-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8rem;
    flex: 1;
    max-width: 260px;
  }

  .illus-label {
    font-family: 'Bebas Neue', cursive;
    font-size: 0.78rem;
    letter-spacing: 0.25em;
    color: var(--orange-mid);
    text-transform: uppercase;
  }

  /* contenedor relativo para partículas absolutas */
  .illus-scene {
    position: relative;
    width: 100%;
    height: clamp(180px, 28vw, 260px);
  }

  .illus-scene svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 8px 24px rgba(242,101,34,0.18));
  }

  /* ── Letras / notas que salen ── */
  .particle {
    position: absolute;
    font-family: 'Bebas Neue', cursive;
    pointer-events: none;
    opacity: 0;
    animation: flyOut var(--dur) var(--delay) ease-in-out infinite;
    transform-origin: center;
  }

  @keyframes flyOut {
    0%   { opacity: 0;   transform: translate(0,0)                         rotate(0deg)       scale(0.5); }
    12%  { opacity: 1; }
    85%  { opacity: 0.6; }
    100% { opacity: 0;   transform: translate(var(--tx), var(--ty))        rotate(var(--rot)) scale(1.15); }
  }

  /* ── Botón + pie ── */
  .bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    margin-top: 3rem;
    opacity: 0;
    animation: fadeUp 0.8s 1.4s ease forwards;
  }

  .tagline {
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: clamp(0.7rem, 1.5vw, 0.82rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .btn-back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: clamp(0.82rem, 1.8vw, 0.95rem);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--orange-deep);
    background: transparent;
    border: 2px solid var(--orange-main);
    border-radius: 60px;
    padding: 0.85rem 2.4rem;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.2s, background 0.25s, color 0.25s, box-shadow 0.3s;
  }
  .btn-back:hover {
    background: var(--orange-main);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 10px 36px rgba(242,101,34,0.35);
  }

  /* ── Logos fijos ── */
  .logos-bar {
    position: fixed;
    bottom: 1.4rem;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 20;
    opacity: 0;
    animation: fadeUp 0.8s 1.7s ease forwards;
  }
  .logos-img {
    max-width: min(380px, 88vw);
    height: auto;
    opacity: 0.88;
    filter: contrast(1.05);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .illustrations { gap: 1.5rem; }
    .illus-col { max-width: 150px; }
  }
</style>
</head>

<script>
/* Partículas suaves de fondo */
const canvas = document.getElementById('bgCanvas');
const ctx    = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); });

const SYMS   = ['♪','♫','♩','♬','A','R','T','E','I','C','U','Ó'];
const COLORS = ['#f26522','#f5a623','#c94e00','#f9c96a'];

const pts = Array.from({length: 40}, () => ({
  x:     Math.random() * window.innerWidth,
  y:     Math.random() * window.innerHeight,
  vy:    -(0.25 + Math.random() * 0.55),
  vx:    (Math.random() - 0.5) * 0.3,
  size:  9 + Math.random() * 18,
  alpha: 0.03 + Math.random() * 0.09,
  sym:   SYMS[Math.floor(Math.random() * SYMS.length)],
  color: COLORS[Math.floor(Math.random() * COLORS.length)],
  rot:   Math.random() * Math.PI * 2,
  rotV:  (Math.random() - 0.5) * 0.012,
}));

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  pts.forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle   = p.color;
    ctx.font        = `${p.size}px 'Bebas Neue', cursive`;
    ctx.textAlign   = 'center';
    ctx.fillText(p.sym, 0, 0);
    ctx.restore();
    p.y += p.vy; p.x += p.vx; p.rot += p.rotV;
    if (p.y < -30) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
  });
  requestAnimationFrame(draw);
}
document.fonts.ready.then(draw);
</script>
